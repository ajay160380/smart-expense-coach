[supervisord]
nodaemon=true

[program:django]
command=bash -c "cd backend && python manage.py migrate && python manage.py collectstatic --noinput && exec gunicorn expense_project.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers ${WEB_CONCURRENCY:-1} --timeout 300"
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=10
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:whatsappbot]
command=bash -c "cd whatsapp_bot && PORT=${PORT:-10000} exec node --max-old-space-size=120 bot.js"
autostart=true
autorestart=unexpected
stopsignal=TERM
stopwaitsecs=30
startsecs=30
startretries=10
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:push_daemon]
command=bash -c "cd backend && exec python random_push_daemon.py"
autostart=true
autorestart=unexpected
stopsignal=TERM
stopwaitsecs=10
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

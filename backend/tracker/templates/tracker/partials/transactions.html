<!-- ✅ TRANSACTIONS — SCROLLABLE VERSION -->
      <div class="txn-section">
        <div class="txn-header">
          <div class="card-title" style="margin:0">💳 Transactions</div>
          <div class="export-btns">
            <button class="export-btn" onclick="exportCSV()">CSV ↓</button>
            <button class="export-btn" onclick="exportPDF()">PDF ↓</button>
          </div>
        </div>
        <div class="search-wrap" style="display:flex; gap: 8px;">
          <div style="position:relative; flex:1;">
            <span class="search-icon" style="position:absolute; left:12px; top:12px;">🔍</span>
            <input class="search-input" id="search-input" placeholder="Search category or note..." oninput="renderTxns()" style="width:100%; padding-left:36px;">
          </div>
          <input type="month" id="month-picker" class="search-input" style="width: auto;" onchange="fetchHistory(this.value)">
        </div>
        <div class="filter-tags" id="filter-tags"></div>
        <div class="txn-count-label">
          <span id="txn-count-text">Loading...</span>
          <span class="scroll-hint" id="scroll-hint" style="display:none;">↕ Scroll to see all</span>
        </div>
        <div class="txn-list-container" id="txn-list-container">
          <div id="txn-list"></div>
        </div>
      </div>

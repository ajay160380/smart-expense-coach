<!-- AI BANNER & COACH SUMMARY -->
<div class="ai-banner" onclick="openAI()">
  <div class="ai-avatar" aria-hidden="true">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/></svg>
  </div>
  <div class="ai-banner-text">
    <div class="ai-banner-label">AI Financial Coach</div>
    <div class="ai-banner-msg" id="banner-msg">{{ ai_main_tip|default:"Hello! I am ExpenseTracker — ask me anything about your finances!" }}</div>
  </div>
  <span class="ai-banner-caret">›</span>
</div>

<!-- Coach Focus Highlight -->
{% if ai_sub_tip %}
<div class="fin-card ai-coach-tip-card">
  <div style="display:flex;align-items:flex-start;gap:14px;">
    <span class="sec-icon-badge" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
    </span>
    <div>
      <div style="font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:var(--primary);margin-bottom:4px;">Smart Observation</div>
      <div style="font-size:15px;color:var(--text);line-height:1.5;font-weight:500;">{{ ai_sub_tip }}</div>
    </div>
  </div>
</div>
{% endif %}

<!-- Live Quick Health Metrics Card inside Coach Tab -->
<div class="fin-card ai-coach-prompts-card">
  <div class="card-title-lg" style="margin-bottom: 4px;">Quick Coach Prompts</div>
  <div class="card-sub-sm" style="margin-bottom: 16px;">Tap any topic to ask your AI advisor immediately</div>
  <div style="display: flex; flex-direction: column; gap: 10px;">
    <button type="button" class="cat-item" style="width:100%;flex-direction:row;justify-content:space-between;align-items:center;" onclick="quickAsk({textContent:'Audit my biggest expense category this month'})">
      <span class="cat-name" style="display:inline-flex;align-items:center;gap:10px;"><span class="sec-icon-badge" style="width:32px;height:32px;border-radius:9px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span>Category Deep-Dive Audit</span>
      <span style="color:var(--primary);font-weight:700;font-size:13.5px;">Ask →</span>
    </button>
    <button type="button" class="cat-item" style="width:100%;flex-direction:row;justify-content:space-between;align-items:center;" onclick="quickAsk({textContent:'Build a daily spending limit plan for the rest of this month'})">
      <span class="cat-name" style="display:inline-flex;align-items:center;gap:10px;"><span class="sec-icon-badge" style="width:32px;height:32px;border-radius:9px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>Rest-of-Month Plan</span>
      <span style="color:var(--primary);font-weight:700;font-size:13.5px;">Ask →</span>
    </button>
    <button type="button" class="cat-item" style="width:100%;flex-direction:row;justify-content:space-between;align-items:center;" onclick="quickAsk({textContent:'Where can I cut wasteful discretionary spend?'})">
      <span class="cat-name" style="display:inline-flex;align-items:center;gap:10px;"><span class="sec-icon-badge" style="width:32px;height:32px;border-radius:9px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg></span>Cut Wasteful Spends</span>
      <span style="color:var(--primary);font-weight:700;font-size:13.5px;">Ask →</span>
    </button>
  </div>
</div>

<div id="anomaly-container" class="anomaly-list"></div>

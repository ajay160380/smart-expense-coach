<!-- PHASE 9.6: "MERA PAISA KAHAN GAYA?" (WHERE DID MY MONEY GO) BREAKDOWN -->
<div class="money-breakdown-card fin-card">
  <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="width: 44px; height: 44px; border-radius: 13px; background: linear-gradient(135deg, #2563EB, #3B82F6); display: flex; align-items: center; justify-content: center; color: #ffffff; box-shadow: 0 6px 16px rgba(37, 99, 235, 0.28);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </div>
      <div>
        <div style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--primary);">Deep Dive Analytics</div>
        <div style="font-size: 20px; font-weight: 800; font-family: var(--display); color: var(--text, #0F172A);">Mera Paisa Kahan Gaya?</div>
      </div>
    </div>
    <div class="mb-period-tabs" id="breakdown-filter-tabs">
      <button onclick="loadMoneyBreakdown('today')" class="mb-pill" id="mb-tab-today">Today</button>
      <button onclick="loadMoneyBreakdown('week')" class="mb-pill" id="mb-tab-week">7 Days</button>
      <button onclick="loadMoneyBreakdown('month')" class="mb-pill active" id="mb-tab-month">Cycle</button>
    </div>
  </div>

  <div id="money-breakdown-content">
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px;">
      <span style="font-size: 15px; color: var(--text3, #64748B); font-weight: 600;">Total Spending</span>
      <span style="font-size: 32px; font-weight: 800; font-family: var(--display); color: var(--text, #0F172A);" id="mb-total">₹0</span>
    </div>

    <!-- Category Progress Bars -->
    <div id="mb-categories-list" style="display: flex; flex-direction: column; gap: 14px;">
      <!-- Populated via AJAX / API -->
    </div>

    <!-- Top 5 Merchants -->
    <div style="margin-top: 22px; border-top: 1px solid var(--border, rgba(148, 163, 184, 0.2)); padding-top: 16px;">
      <div style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text3, #64748B); margin-bottom: 10px;">Top Spends by Merchant</div>
      <div id="mb-top-merchants" style="display: flex; flex-wrap: wrap; gap: 10px;">
        <!-- Populated via JS -->
      </div>
    </div>
  </div>
</div>

<script>
async function loadMoneyBreakdown(period) {
  try {
    document.querySelectorAll('#breakdown-filter-tabs .mb-pill').forEach(btn => {
      btn.classList.remove('active');
    });
    const activeBtn = document.getElementById('mb-tab-' + period);
    if (activeBtn) {
      activeBtn.classList.add('active');
    }

    const res = await fetch('/api/money-breakdown/?period=' + period, { credentials: 'same-origin' });
    if (!res.ok) return;
    const data = await res.json();
    
    document.getElementById('mb-total').innerText = '₹' + Math.round(data.total_spent || 0).toLocaleString('en-IN');
    
    const catList = document.getElementById('mb-categories-list');
    catList.innerHTML = '';
    const blueBarSwatches = ['#2563EB', '#0EA5E9', '#3B82F6', '#38BDF8', '#1D4ED8'];
    (data.breakdown || []).forEach((item, idx) => {
      if (item.total <= 0) return;
      const barCol = blueBarSwatches[idx % blueBarSwatches.length];
      const row = document.createElement('div');
      row.innerHTML = `
        <div style="display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 7px;">
          <span>${item.icon} <strong>${item.name}</strong></span>
          <span style="font-family: var(--display); font-variant-numeric: tabular-nums; font-weight: 700;">₹${Math.round(item.total).toLocaleString('en-IN')} <span style="color: var(--text3, #64748B); font-weight: 500; font-size: 13.5px;">(${item.percent}%)</span></span>
        </div>
        <div style="height: 9px; background: var(--surface3, #EAEEF5); border-radius: 9999px; overflow: hidden;">
          <div style="height: 100%; width: ${Math.min(100, item.percent)}%; background: ${barCol}; border-radius: 9999px;"></div>
        </div>
      `;
      catList.appendChild(row);
    });

    const merchBox = document.getElementById('mb-top-merchants');
    merchBox.innerHTML = '';
    (data.top_merchants || []).forEach(m => {
      const pill = document.createElement('div');
      pill.className = 'mb-merchant-chip';
      pill.title = m.merchant + ': ₹' + Math.round(m.total).toLocaleString('en-IN');
      const nameSpan = document.createElement('span');
      nameSpan.className = 'mb-merchant-name';
      nameSpan.textContent = m.merchant;
      const amtSpan = document.createElement('span');
      amtSpan.className = 'mb-merchant-amt';
      amtSpan.textContent = '₹' + Math.round(m.total).toLocaleString('en-IN');
      pill.appendChild(nameSpan);
      pill.appendChild(amtSpan);
      merchBox.appendChild(pill);
    });
  } catch (err) {
    console.error('Error loading money breakdown', err);
  }
}
document.addEventListener('DOMContentLoaded', () => { loadMoneyBreakdown('month'); });
</script>

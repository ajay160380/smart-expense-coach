<!-- 💡 DAILY MONEY TIP BANNER (Matches Reference Top Banner Card) -->
<div class="tip-section" id="tip-section">
  <div class="tip-left">
    <span class="tip-icon-badge" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/>
        <path d="M9 18h6"/><path d="M10 22h4"/>
      </svg>
    </span>
    <div>
      <div class="tip-label">Today's Money Tip</div>
      <div class="tip-text" id="daily-tip-text">Loading your personalized tip...</div>
    </div>
  </div>
  <button class="tip-refresh" onclick="fetchDailyTip()" title="Refresh tip" aria-label="Refresh daily tip">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="23 4 23 10 17 10"/>
      <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
    </svg>
    <span>Refresh Tip</span>
  </button>
</div>

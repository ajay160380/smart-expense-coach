<!-- 📱 EXPENSE SPLIT -->
      <div class="split-section">
        <div class="bills-header">
          <div class="section-title">📱 Split Expenses</div>
          <button class="add-small-btn" onclick="openModal('splitModal')">+ New Split</button>
        </div>
        <div class="split-scroll" id="split-list">
          {% for split in active_splits %}
          <div class="split-card {% if split.is_settled %}settled{% endif %}" id="split-card-{{ split.pk }}">
            <div class="split-top">
              <span class="split-emoji">👥</span>
              <span class="split-name">{{ split.name }}</span>
              <span class="split-members-badge">{{ split.members.count }} members</span>
            </div>
            <div class="split-total" id="split-total-{{ split.pk }}">₹{{ split.tot|floatformat:0 }}</div>
            <div class="split-pp" id="split-pp-{{ split.pk }}">Per person: ₹{{ split.pp|floatformat:0 }}</div>
            <div class="split-actions-row">
              <button class="split-action" 
                      data-pk="{{ split.pk }}" 
                      data-name="{{ split.name|escapejs }}" 
                      data-members='[{% for m in split.members.all %}"{{ m.name|escapejs }}"{% if not forloop.last %},{% endif %}{% endfor %}]'
                      onclick="openAddSplitExpense(this.getAttribute('data-pk'), this.getAttribute('data-name'), JSON.parse(this.getAttribute('data-members')))">+ Expense</button>
              <button class="split-action" onclick="viewSplitSummary('{{ split.pk }}')">Summary</button>
              <button class="split-action" onclick="settleSplit('{{ split.pk }}')">Settle</button>
              <button class="split-action" style="color:var(--red);" onclick="deleteSplit('{{ split.pk }}')">Delete</button>
            </div>
          </div>
          {% empty %}
          <div style="text-align:center;padding:30px;color:var(--text3);font-size:13px;width:100%;">
            No split groups yet. Create one for your next trip! ✈️
          </div>
          {% endfor %}
        </div>
      </div>

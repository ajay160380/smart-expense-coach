<div class="card ai-inline-card">
  <div class="ai-pop-head ai-inline-head">
    <div class="ai-pop-av" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
    </div>
    <div>
      <div class="ai-pop-name" style="font-size: 18px; color: #ffffff;">ExpenseTracker AI</div>
      <div class="ai-pop-status" style="font-size: 12.5px; color: rgba(255,255,255,0.88);">● Always online · Personal Finance Coach</div>
    </div>
  </div>
  
  <div class="ai-error-banner" id="ai-error-banner">
    ⚠️ <span id="ai-error-text">Unable to connect to the server.</span>
    <button onclick="retryLastMsg()" style="margin-left:auto;background:var(--red);color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:var(--font);font-weight:600;">Retry</button>
  </div>
  
  <div class="ai-msgs ai-inline-msgs" id="ai-msgs"></div>
  
  <div class="ai-chips ai-inline-chips" id="ai-chips">
    <button class="ai-chip" onclick="quickAsk(this)">Where is my money going?</button>
    <button class="ai-chip" onclick="quickAsk(this)">Analyze my budget</button>
    <button class="ai-chip" onclick="quickAsk(this)">How can I save ₹5000?</button>
    <button class="ai-chip" onclick="quickAsk(this)">Give top 3 saving tips</button>
  </div>
  
  <div class="ai-input-row ai-inline-input-row">
    <input class="ai-input" id="ai-input" placeholder="Ask anything about your spending, budget, or savings..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}">
    <button class="ai-send ai-inline-send" id="ai-send" onclick="sendMsg()" title="Send">➤</button>
  </div>
</div>

<script>
  // Initialize AI chat when this tab is opened if not already initialized
  document.addEventListener('DOMContentLoaded', () => {
    // Send welcome message automatically if history is empty
    setTimeout(() => {
      if (!aiHistory.length && document.getElementById('ai-msgs').innerHTML === '') {
        sendWelcome();
      }
    }, 500);
  });
</script>

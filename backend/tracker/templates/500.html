{% extends 'tracker/base.html' %}
{% load static %}

{% block content %}
<div style="min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
    <div style="background: var(--bg-glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--border-glass); border-radius: var(--radius-lg); padding: 50px 30px; text-align: center; max-width: 600px; width: 100%; box-shadow: var(--shadow-soft);" data-aos="zoom-in">
        
        <div style="position: relative; display: inline-block; margin-bottom: 20px;">
            <i class="fa-solid fa-bolt" style="position: absolute; top: -10px; left: -30px; font-size: 35px; color: var(--secondary); opacity: 0.8; animation: float 4s ease-in-out infinite;"></i>
            <h1 style="font-family: 'Outfit', sans-serif; font-size: clamp(60px, 10vw, 100px); font-weight: 800; line-height: 1; margin: 0; background: linear-gradient(135deg, #EF4444, #F59E0B); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: var(--shadow-glow);">500</h1>
            <i class="fa-solid fa-wrench" style="position: absolute; bottom: 0; right: -25px; font-size: 28px; color: #EF4444; animation: float 3s ease-in-out infinite 1s;"></i>
        </div>
        
        <h2 style="font-family: 'Outfit', sans-serif; font-size: 28px; font-weight: 700; color: var(--text-main); margin-bottom: 15px;">Internal Server Error</h2>
        
        <p style="color: var(--text-muted); font-size: 16px; line-height: 1.6; margin-bottom: 35px;">
            Oops! Our servers are experiencing a temporary hiccup. Let's get you back to safety while our engineers fix the warp drive.
        </p>
        
        <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
            <a href="{% url 'dashboard' %}" class="btn-primary" style="display: inline-flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-house"></i> Back to Dashboard
            </a>
            <a href="javascript:location.reload()" class="btn-glass" style="display: inline-flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-rotate-right"></i> Refresh Page
            </a>
        </div>
    </div>
</div>

<style>
@keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-12px) rotate(5deg); }
}
</style>
{% endblock %}

name: Production Hardening CI

on:
  push:
    branches: [ main, prod-hardening, phase9-features ]
  pull_request:
    branches: [ main, prod-hardening, phase9-features ]

jobs:
  backend-test:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-testing-secret-key-do-not-use-in-prod-12345
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Django Tests
        run: |
          cd backend
          python manage.py test tracker --verbosity=2

  bot-audit:
    name: WhatsApp Bot Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: whatsapp_bot/package.json

      - name: Install Bot Dependencies
        run: |
          cd whatsapp_bot
          npm install

      - name: Audit NPM Dependencies
        run: |
          cd whatsapp_bot
          npm audit --audit-level=critical || true

  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
